<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a4a2a" />
    <meta name="description" content="Sistem D&D Digital – Mobile-First PWA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <title>D&D Sistem</title>
    <script>
      // Prevent flash of wrong theme - apply dark mode immediately
      (function() {
        const stored = localStorage.getItem('dnd-app')
        if (stored) {
          try {
            const data = JSON.parse(stored)
            if (data && data.state && data.state.darkMode) {
              document.documentElement.classList.add('dark')
            }
          } catch (e) {
            console.error('Error parsing theme:', e)
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
